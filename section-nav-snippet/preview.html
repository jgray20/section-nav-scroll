<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section Nav Preview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="section-nav.css" rel="stylesheet">
<style>
    body { padding-top: 30px; }
    .demo-section { min-height: 100vh; padding: 60px 0; border-bottom: 1px dashed #ccc; }
    .container { max-width: 900px; }
</style>
</head>
<body>
<div class="container">

    <!-- section-nav.html markup -->
    <div id="sectionNav" class="section-nav-js">
        <div class="container-fluid">
            <div class="section-nav__wrap">
                <div class="section-nav__mobile-menu d-lg-none">
                    <button id="sectionNavCollapseToggle" class="section-nav__toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sectionNavCollapse" aria-expanded="false" aria-controls="sectionNavCollapse">
                        Select a Section
                    </button>
                </div>
                <div class="section-nav__collapse collapse" id="sectionNavCollapse">
                    <div class="scrollable-list__wrapper">
                        <button class="scrollable-list__btn scrollable-list__btn-prev" type="button" aria-label="Previous section"></button>

                        <nav class="section-nav scrollable-list">
                            <div id="sectionNavScrollSpy" tabindex="0">
                                <ul class="section-nav__list js-section-nav-list">
                                    <li class="section-nav__item">
                                        <a class="nav-link" href="#anchorNav01">Section One</a>
                                    </li>
                                    <li class="section-nav__item">
                                        <a class="nav-link" href="#anchorNav02">Section Two</a>
                                    </li>
                                    <li class="section-nav__item">
                                        <a class="nav-link" href="#anchorNav03">Section Three</a>
                                    </li>
                                    <li class="section-nav__item">
                                        <a class="nav-link" href="#anchorNav04">Section Four</a>
                                    </li>
                                </ul>
                            </div>
                        </nav>
                        <button class="scrollable-list__btn scrollable-list__btn-next" type="button" aria-label="Next section"></button>
                    </div>
                    <div class="section-nav__cta">
                        <a href="#" class="btn btn-sm btn-primary">Contact Us</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- /section-nav.html markup -->

    <div id="anchorNav01" class="demo-section">
        <h2>Section One</h2>
        <p>Placeholder content so the page is tall enough to scroll and trigger the scrollspy.</p>
    </div>
    <div id="anchorNav02" class="demo-section">
        <h2>Section Two</h2>
        <p>Placeholder content.</p>
    </div>
    <div id="anchorNav03" class="demo-section">
        <h2>Section Three</h2>
        <p>Placeholder content.</p>
    </div>
    <div id="anchorNav04" class="demo-section">
        <h2>Section Four</h2>
        <p>Placeholder content.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="horizontal-scroll.js"></script>
<script src="section-nav.js"></script>
</body>
</html>
